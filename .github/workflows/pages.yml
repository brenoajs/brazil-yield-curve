name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 22:00 UTC, seg-sex (~19:00 BRT), depois do fechamento da B3.
    # Cron do GitHub pode atrasar de 10 a 60 min e e desativado apos 60 dias
    # sem atividade no repositorio.
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore database from data branch
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth 1 origin data
            git show FETCH_HEAD:byc.db > backend/byc.db
            echo "SEED_DAYS=5" >> "$GITHUB_ENV"
            echo "banco restaurado do branch data"
          else
            echo "branch data ausente - carga inicial"
            echo "SEED_DAYS=60" >> "$GITHUB_ENV"
          fi

      - name: Ingest official data (3 attempts)
        working-directory: backend
        env:
          BYC_SOURCE: official
        run: |
          for attempt in 1 2 3; do
            if python seed.py --days "$SEED_DAYS" --source official; then
              echo "ingest ok (attempt $attempt)"
              exit 0
            fi
            echo "ingest failed, attempt $attempt of 3"
            [ "$attempt" -lt 3 ] && sleep 60
          done
          echo "ingest failed after 3 attempts"
          exit 1

      - name: Export API as static files
        working-directory: backend
        run: python export_static.py --out ../frontend/public

      - name: Persist database to data branch
        run: |
          rm -rf /tmp/dbstore
          mkdir -p /tmp/dbstore
          cp backend/byc.db /tmp/dbstore/byc.db
          cd /tmp/dbstore
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git add byc.db
          git commit -q -m "data: snapshot $(date -u +%F)"
          git push -f origin data

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
